services:
  app:
    build: ./docker
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    environment: { HOME: /tmp, COMPOSER_HOME: /tmp/composer }
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports: ["8000:8000"]
    depends_on: [mysql, redis]
  vite:
    image: node:22
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    command: npm run dev -- --host 0.0.0.0
    ports: ["5173:5173"]
  reverb:
    build: ./docker
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["8080:8080"]
    depends_on: [redis]
  queue:
    build: ./docker
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    command: php artisan queue:work --tries=3
    depends_on: [mysql, redis]
  scheduler:
    build: ./docker
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes: [".:/var/www/html"]
    command: php artisan schedule:work
    depends_on: [mysql, redis]
  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: pbms, MYSQL_USER: pbms, MYSQL_PASSWORD: secret, MYSQL_ROOT_PASSWORD: root }
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+00:00 --log-bin-trust-function-creators=1
    volumes: ["mysqldata:/var/lib/mysql"]
    ports: ["33069:3306"]
  redis:
    image: redis:7-alpine
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]
volumes: { mysqldata: {} }
