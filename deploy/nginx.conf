worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on; keepalive_timeout 30; server_tokens off; client_max_body_size 60m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  access_log /dev/stdout; error_log /dev/stderr warn;
  server {
    listen 80; root /var/www/html/public; index index.php;
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
      fastcgi_pass 127.0.0.1:9000; include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name; fastcgi_param DOCUMENT_ROOT $realpath_root;
      fastcgi_read_timeout 60s;
    }
    location ~ /\.(?!well-known) { deny all; }
  }
}
